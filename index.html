<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes - A fast, simple, and organized note-taking application.">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture thoughts, organize ideas, and find them quickly.</p>
  </header>

  <main>
    <section id="add-note-section" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Content</label>
          <input type="text" id="note-input" name="note-input" placeholder="What's on your mind?">
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit" id="submit-btn">Add Note</button>
      </form>
      <p id="error-message" aria-live="polite"></p>
    </section>

    <section id="manage-notes-section" aria-labelledby="manage-notes-heading">
      <h2 id="manage-notes-heading">Your notes</h2>
      <div class="search-group">
        <label for="search-input">Search Notes</label>
        <input type="search" id="search-input" name="search-input" placeholder="Search notes by keyword...">
      </div>

      <div class="notes-header">
        <p id="note-count"></p>
        <button type="button" id="clear-all-btn">Clear all</button>
      </div>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. All rights reserved.</p>
  </footer>
</body>
</html>
